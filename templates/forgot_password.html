<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - DriveEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        DriveEase
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('cars_page') }}">
            Cars
        </a>

        <a href="{{ url_for('login_page') }}">
            Login
        </a>

        <a href="{{ url_for('register_page') }}">
            Register
        </a>

    </div>

</nav>


<section class="auth-section">

    <div class="auth-box">

        <p class="auth-tag">
            RESET PASSWORD
        </p>

        <h1>
            Forgot Password?
        </h1>

        <p class="auth-subtitle">
            Enter your registered email and phone number.
        </p>


        <form id="forgotPasswordForm">

            <label for="resetEmail">
                Email Address
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter your registered email"
                required
            >


            <label for="resetPhone">
                Contact Number
            </label>

            <input
                type="tel"
                id="resetPhone"
                placeholder="Enter your registered phone number"
                required
            >


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter your new password"
                required
                minlength="6"
            >


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                required
                minlength="6"
            >


            <button
                type="submit"
                class="auth-button">
                Reset Password
            </button>

        </form>


        <p class="auth-footer">

            Remember your password?

            <a href="{{ url_for('login_page') }}">
                Back to Login
            </a>

        </p>

    </div>

</section>


<script>

const forgotPasswordForm =
    document.querySelector("#forgotPasswordForm");


forgotPasswordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.querySelector("#resetEmail").value;

        const phone =
            document.querySelector("#resetPhone").value;

        const newPassword =
            document.querySelector("#newPassword").value;

        const confirmPassword =
            document.querySelector("#confirmPassword").value;


        if (newPassword !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        try {

            const response = await fetch(
                "/api/forgot-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        phone: phone,

                        new_password: newPassword

                    })

                }
            );


            const data =
                await response.json();


            if (data.success) {

                alert(
                    "Password reset successfully!"
                );

                window.location.href =
                    "{{ url_for('login_page') }}";

            } else {

                alert(data.message);

            }


        } catch (error) {

            console.error(error);

            alert(
                "Something went wrong. Please try again."
            );

        }

    }
);

</script>

</body>
</html>
